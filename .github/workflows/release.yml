name: Release

# 什么时候跑：推一个 v 开头的标签（比如 v1.1.0），或在 Actions 页面手动指定标签
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，例如 v1.1.0'
        required: true

# 建 Release 和上传文件需要写权限
permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只出 dmg：不再生成 msi，也不生成 updater 的 .app.tar.gz
          - platform: macos-latest
            name: macOS arm64
            target: aarch64-apple-darwin
            bundle: dmg
            suffix: arm64.dmg
          # 只出 NSIS 安装包：不再生成 msi
          - platform: windows-latest
            name: Windows x64
            target: x86_64-pc-windows-msvc
            bundle: nsis
            suffix: x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      - name: 打包
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      # 改名成 apix_<版本>_arm64.dmg / apix_<版本>_x64.exe
      # 只挑这一个文件往下传，别的产物不会溜进 Release
      - name: 挑出安装包并改名
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "版本号：$VERSION"

          mkdir -p out
          SOURCE=$(find "src-tauri/target/${{ matrix.target }}/release/bundle" \
                     -type f \( -name "*.dmg" -o -name "*.exe" \) | head -n 1) || true

          if [ -z "${SOURCE:-}" ]; then
            echo "::error::没找到安装包，bundle 目录里实际有："
            find src-tauri/target -path "*bundle*" -type f | head -20
            exit 1
          fi

          TARGET="out/apix_${VERSION}_${{ matrix.suffix }}"
          cp "$SOURCE" "$TARGET"
          echo "最终产物：$TARGET"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apix-${{ matrix.suffix }}
          path: out/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: 建草稿 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 两个平台的产物合到同一个目录
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 确认只有两个文件
        run: ls -lh dist

      - name: 建草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ### 下载

          | 系统 | 文件 |
          |---|---|
          | macOS（Apple Silicon） | `apix_*_arm64.dmg` |
          | Windows（64 位） | `apix_*_x64.exe` |

          ### 首次打开会被系统拦一下

          安装包没有做 Apple 开发者签名（证书 99 美元/年），只做了 ad-hoc 签名：
          代码是完整的、没被篡改，但系统不认识这个开发者。

          **macOS**

          1. 右键点 `apix.app` → 选「打开」→ 弹窗里再点一次「打开」
          2. 没有「打开」按钮的话：系统设置 → 隐私与安全性 → 拉到底 → 点「仍要打开」
          3. 还是不行就清掉隔离属性：`xattr -cr /Applications/apix.app`

          **Windows**

          SmartScreen 蓝色窗口点「更多信息」→「仍要运行」

          不想折腾的话，自己从源码编译最快：`pnpm tauri build`
          EOF

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，改为覆盖上传"
            gh release upload "$TAG" dist/* --clobber
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" dist/* \
              --draft \
              --title "apix $TAG" \
              --notes-file notes.md
          fi
